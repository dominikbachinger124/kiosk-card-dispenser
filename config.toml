# Nicht geheime Standardkonfiguration. Keine PIN, UID oder Salt eintragen.

[app]
language = "de"
mode = "real"

[money]
topup_cents = 2000
deposit_cents = 500
gatekeeper_collection_cents = 2500
default_payment_cents = 200

[hardware]
mode = "real"
k720_port = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A402W7SS-if00-port0"
# Protokoll docs/k720_protocol.md: 9600 8N1.
serial_baudrate = 9600
flipper_port = "/dev/serial/by-id/usb-Flipper_Devices_Inc._Flipper_Ienfodna_flip_Ienfodna-if00"

[admin]
# Ein bis zwei UIDs und PIN-Hash lokal bereitstellen; keine Secrets committen.
admin_uids = []
pin_hash = ""

[privacy]
# Salt nur lokal ueber Umgebung/ignorierte Konfiguration bereitstellen.
id_hash_salt_env = "KIOSK_ID_HASH_SALT"
